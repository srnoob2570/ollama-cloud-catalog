name: update-pricing

# Weekly cron plus manual dispatch. The rate card changes through a human
# decision on Ollama's side, so weekly is a refresh, not a guarantee.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pricing
  cancel-in-progress: false

jobs:
  update-pricing:
    runs-on: [self-hosted, dockerless]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Refresh pricing from the live rate card
        # Extraction runs on ollama-cloud glm-5.3-flash with structured
        # outputs; any coverage problem aborts before writing.
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          bun install --frozen-lockfile
          bun src/update-pricing.ts

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain pricing.json catalog.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pricing.json catalog.json
            git commit -m "chore: refresh ollama cloud pricing"
            git push
            # catalog.json carries the cost fields too; without the purge the
            # CDN may serve mismatched halves until its TTL expires.
            for f in pricing.json catalog.json; do
              curl -sfS "https://purge.jsdelivr.net/gh/srnoob2570/ollama-cloud-catalog@main/$f" \
                || echo "::warning::jsDelivr purge failed for $f; CDN may serve it stale until its TTL expires"
            done
          else
            echo "Pricing unchanged, nothing to commit"
          fi